name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Run a snapshot build (no publish)'
        required: false
        default: 'false'
        type: choice
        options: [ 'false','true' ]

permissions:
  contents: write   # needed to create GitHub Releases
  packages: write   # future use (if publishing containers)
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate go.mod
        run: go mod tidy && git diff --exit-code || (echo 'go.mod/go.sum not tidy' && exit 1)

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          install-only: true

      - name: Run GoReleaser (snapshot)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.snapshot == 'true'
        run: goreleaser release --snapshot --skip=publish --skip=announce --clean

      - name: Run GoReleaser (tag release)
        if: startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && github.event.inputs.snapshot == 'true')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean

      - name: Upload snapshot artifacts
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.snapshot == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: snapshot-dist
          path: dist/**

      - name: Show built artifacts
        if: always()
        run: ls -1 dist || true
